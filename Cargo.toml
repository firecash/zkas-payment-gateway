[workspace]
resolver = "2"
members = ["core", "service"]

# Standalone home of the ZKas merchant payment gateway. `kaspa-addresses` (address
# encoding) comes from the node repository as a git dependency, so this repo can never
# drift from the chain's address format. Everything else is crates.io.
#
# Not `kaspa-shielded-core`: it builds only inside the node workspace, which patches
# `zakura-orchard` by path, and a [patch] does not reach a git dependency. Tests derive
# the viewing key with `orchard` directly. The URL must end in `.git`: without it
# zkas.info redirects to the web page, which cargo cannot clone.
[workspace.package]
version = "2.0.1"
edition = "2024"
rust-version = "1.91.0"
authors = ["ZKas developers"]
license = "ISC"
repository = "https://zkas.info/code/gateway"

[workspace.lints.clippy]
empty_docs = "allow"
uninlined_format_args = "allow"

[workspace.dependencies]
# Intra-chain crates, pinned to firecash-rusty so the gateway shares the exact
# address/keys encoding the node and wallet use.
kaspa-addresses = { git = "https://zkas.info/code/rusty.git", branch = "main" }

# Local member.
zkas-payment-gateway = { version = "2.0.1", path = "core" }

# crates.io — versions match the node workspace to keep a single resolved graph.
hex = { version = "0.4.3", features = ["serde"] }
hmac = { version = "0.12.1", default-features = false }
rand = "0.8.5"
serde = { version = "1.0.190", features = ["derive", "rc", "alloc"], default-features = false }
serde_json = "1.0.107"
sha2 = { version = "0.10.8", default-features = false }
tokio = { version = "1.42.1", features = ["sync"] }

# Release profile knobs the node workspace applies to the heavy Halo2 crates
# `kaspa-shielded-core` pulls in — kept so a release build of the gateway (and
# its tests) matches the node's optimized proving/verifying code.
[profile.release.package.halo2_proofs]
opt-level = 3
[profile.release.package.halo2_gadgets]
opt-level = 3
[profile.release.package.pasta_curves]
opt-level = 3
[profile.release.package.orchard]
opt-level = 3
